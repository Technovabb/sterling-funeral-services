# Rebuilds the generated pages whenever the site's data or photos change, so an
# obituary published from the upload portal (portal/) - which only commits
# data/obituaries.json and a photo - becomes a real page without anyone running
# `node tools/build-obituaries.js` by hand.
#
# Also runs every night, because "Upcoming funerals" depends on today's date:
# a service that has taken place moves to "Watch a service" on its own.
#
# A run that changes nothing commits nothing (the build is byte-identical when
# nothing has changed). Commits made here use GITHUB_TOKEN, which GitHub does
# not let trigger further workflow runs, so this can never loop.

name: Rebuild site

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 4 * * *" # 04:15 UTC = 00:15 in Barbados
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-site
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the sitemap dates each page by its last commit

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build pages
        run: node tools/build-obituaries.js

      - name: Commit rebuilt pages
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed - the site is already up to date."
            exit 0
          fi
          git config user.name "Sterling site builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild pages (${GITHUB_EVENT_NAME}, ${GITHUB_SHA::7})"
          # someone may have published again while this ran
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "Could not push the rebuilt pages after 3 attempts." >&2
          exit 1
