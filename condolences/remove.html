<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Remove condolences | Sterling Funeral Services</title>
<link rel="icon" type="image/png" href="../favicon-32.png" />
<link rel="stylesheet" href="../css/styles.css?v=88c251ff" />
<style>
  /* Staff-only page: kept plain and phone-friendly, outside the site's nav. */
  .manage { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  .manage h1 { font-size: 2rem; margin: 0 0 8px; }
  .manage .muted { opacity: .75; }
  .manage form, .manage .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0; }
  .manage input { flex: 1 1 220px; padding: 12px; font: inherit; border: 1px solid #c9bfb6; border-radius: 4px; }
  .manage ul { list-style: none; padding: 0; margin: 0; }
  .manage li { border: 1px solid #e3dbd3; border-radius: 6px; padding: 14px 16px; margin: 0 0 12px; background: #fff; }
  .manage li p { margin: 0 0 6px; overflow-wrap: anywhere; }
  .manage .who { font-weight: 600; }
  .manage .where { font-size: .85rem; opacity: .7; }
  .manage .remove { margin-top: 6px; }
  .manage [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="manage">
<p class="eyebrow">Sterling Funeral Services</p>
<h1>Remove a condolence</h1>
<p class="muted">Messages posted on obituary pages appear straight away. If one should not be there, remove it here and it disappears from the site at once.</p>

<form id="login">
<input id="passcode" type="password" placeholder="Passcode" autocomplete="current-password" required />
<button class="button wine" type="submit">Open</button>
</form>
<p id="status" role="status"></p>

<section id="manage" hidden>
<div class="toolbar"><input id="filter" type="search" placeholder="Filter by name or obituary" /></div>
<ul id="list"></ul>
</section>
</main>

<script src="../js/live-config.js?v=7d3e9082"></script>
<script>
(function () {
  var cfg = window.STERLING_LIVE || {};
  var status = document.getElementById("status");
  var key = "";
  try { key = sessionStorage.getItem("sterling-passcode") || ""; } catch (e) {}

  if (!cfg.url || !cfg.key) {
    status.textContent = "Live condolences are not switched on yet.";
    document.getElementById("login").hidden = true;
    return;
  }

  function headers(extra) {
    var h = { apikey: cfg.key, Accept: "application/json", "Content-Type": "application/json" };
    if (/^eyJ/.test(cfg.key)) h.Authorization = "Bearer " + cfg.key;
    return h;
  }
  function rpc(fn, body) {
    return fetch(cfg.url + "/rest/v1/rpc/" + fn, { method: "POST", headers: headers(), body: JSON.stringify(body) })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error((j && j.message) || "error " + r.status);
          return j;
        });
      });
  }
  function nameFromSlug(s) {
    return s.split("-").map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(" ");
  }

  function load() {
    status.textContent = "Loading…";
    fetch(cfg.url + "/rest/v1/condolences?select=id,slug,name,relationship,message,created_at&order=created_at.desc&limit=500", { headers: headers() })
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        var list = document.getElementById("list");
        list.textContent = "";
        rows.forEach(function (c) {
          var li = document.createElement("li");
          li.setAttribute("data-search", (c.name + " " + c.slug + " " + c.message).toLowerCase());
          var who = document.createElement("p"); who.className = "who";
          who.textContent = c.name + (c.relationship ? " · " + c.relationship : "");
          var msg = document.createElement("p"); msg.textContent = c.message;
          var where = document.createElement("p"); where.className = "where";
          var a = document.createElement("a"); a.href = "../obituaries/" + c.slug + ".html"; a.target = "_blank";
          a.textContent = nameFromSlug(c.slug);
          where.appendChild(document.createTextNode("On "));
          where.appendChild(a);
          where.appendChild(document.createTextNode(" · " + new Date(c.created_at).toLocaleString()));
          var btn = document.createElement("button");
          btn.className = "button wine remove"; btn.type = "button"; btn.textContent = "Remove";
          btn.addEventListener("click", function () {
            if (!confirm("Remove this message from " + c.name + "? It will disappear from the site.")) return;
            btn.disabled = true;
            rpc("hide_condolence", { p_id: c.id, p_key: key }).then(function (ok) {
              if (ok) li.remove();
              else { btn.disabled = false; alert("That did not work. Check the passcode."); }
            }, function (e) { btn.disabled = false; alert(e.message); });
          });
          li.append(who, msg, where, btn);
          list.appendChild(li);
        });
        status.textContent = rows.length ? rows.length + " message(s) on the site, newest first." : "No messages have been posted yet.";
        document.getElementById("manage").hidden = false;
      }, function () { status.textContent = "Could not load the messages. Check the connection and refresh."; });
  }

  function open(k) {
    status.textContent = "Checking…";
    rpc("check_passcode", { p_key: k }).then(function (ok) {
      if (!ok) { status.textContent = "That passcode is not right."; return; }
      key = k;
      try { sessionStorage.setItem("sterling-passcode", k); } catch (e) {}
      document.getElementById("login").hidden = true;
      load();
    }, function (e) { status.textContent = e.message; });
  }

  document.getElementById("login").addEventListener("submit", function (e) {
    e.preventDefault();
    open(document.getElementById("passcode").value);
  });
  document.getElementById("filter").addEventListener("input", function () {
    var q = this.value.toLowerCase();
    document.querySelectorAll("#list li").forEach(function (li) {
      li.hidden = q && li.getAttribute("data-search").indexOf(q) < 0;
    });
  });
  if (key) open(key);
})();
</script>
</body>
</html>
